# ViaBot Garage Survey Rig — configuration
#
# Copy to config/config.yaml and edit. config/config.yaml is gitignored
# because it holds the WiFi password and router login; this repo is public.
#
#     cp config/config.example.yaml config/config.yaml
#
# Every value here can also be overridden by an environment variable named
# VIABOT_<SECTION>_<KEY>, e.g. VIABOT_PING_TARGET=1.1.1.1

# ----------------------------------------------------------------------------
# Wi-Fi access point the Pi broadcasts for your phone.
# Applied by scripts/setup_ap.sh — editing this file alone does not reconfigure
# the AP; re-run that script after changing anything in this section.
# ----------------------------------------------------------------------------
ap:
  ssid: ViaBot-Survey
  # WPA2 passphrase, 8-63 characters. CHANGE THIS.
  password: changeme123
  interface: wlan0
  # 2.4 GHz ("bg") penetrates concrete better than 5 GHz ("a") and is more
  # compatible with older phones. Stick with bg unless you have a reason.
  band: bg
  channel: 6
  # Pi's address on the AP subnet. This is the URL you browse to.
  address: 192.168.50.1
  prefix: 24
  dhcp_range: [192.168.50.10, 192.168.50.100]
  # Wi-Fi regulatory domain. The Pi's radio stays soft-blocked until this is
  # set. Two-letter ISO country code.
  country: US
  # Deny AP clients (your phone) any route to the internet.
  # Strongly recommended ON: it keeps phone background traffic from competing
  # with the measurements over the same modem, and it is what makes phones
  # reliably pop the captive portal instead of silently falling back to LTE.
  block_client_internet: true

# ----------------------------------------------------------------------------
# Uplink under test: the Pi's wired link to the router, whose WAN is cellular.
# ----------------------------------------------------------------------------
uplink:
  interface: eth0
  router_address: 192.168.1.1

# ----------------------------------------------------------------------------
# Continuous ping — the primary dead-zone signal. Cheap: ~60 bytes/s.
# ----------------------------------------------------------------------------
ping:
  enabled: true
  target: 8.8.8.8
  interval_s: 1.0
  timeout_s: 2.0
  # Rolling window used to compute loss %, jitter and the status colour.
  window_s: 10

# ----------------------------------------------------------------------------
# DNS resolution check — catches "packets flow but nothing works" cases.
# ----------------------------------------------------------------------------
dns:
  enabled: true
  hostname: google.com
  interval_s: 30

# ----------------------------------------------------------------------------
# iperf3 throughput.
#
# DISABLED until you stand up your own iperf3 server. Set `server` to its
# host/IP and flip `enabled` to true — nothing else needs to change.
# See docs/IPERF_SERVER.md for the server-side setup.
#
# WARNING: this is the only part of the rig that uses real cellular data.
# At the defaults below (5 s test, 25 Mbit/s cap, once a minute) budget roughly
# 0.5-1 GB per 30-minute walk. Read docs/IPERF_SERVER.md before enabling.
# ----------------------------------------------------------------------------
iperf3:
  enabled: false
  server: null
  # Its own port, deliberately not 5201 or 5202: one iperf3 server runs one
  # test at a time, so sharing a port with udp_load means whichever starts
  # second is told "the server is busy" and measures nothing.
  port: 5203
  # Seconds per test.
  duration_s: 5
  # Seconds between tests.
  interval_s: 60
  # Bitrate cap per test, e.g. "25M". null = uncapped (much more data).
  bitrate: 25M
  # "download" | "upload" | "both"
  direction: download
  # Parallel streams.
  streams: 1
  # Hard ceiling on cellular data per run. The worker stops launching tests
  # once a run has used this much. null = no limit.
  run_data_budget_mb: 2000
  # Same server and the same credentials as udp_load, if both are in use.
  username: ""
  password: ""
  public_key_path: ""

# ----------------------------------------------------------------------------
# Continuous UDP load — jitter and packet loss under a real teleop stream.
#
# Everything else here measures an idle link. Ping sends 60 bytes a second and
# finds a garage where nothing gets through; it does not find the more
# interesting failure, which is a spot that looks fine empty and falls apart the
# moment you put video on it. Carriers shape UDP differently from TCP and drop
# it first under contention, so a link that passes a TCP speed test can still be
# useless for teleoperation.
#
# This holds one UDP stream open for the whole walk and records what the
# receiving end sees every second, which is the same question the remote
# operator is asking, asked at every point in the garage.
#
# This is by far the most data the rig moves — bitrate times the length of the
# walk, so about 340 MB for a 30-minute walk at 1.5 Mbit/s. The SIM is
# unlimited, so that is a load question rather than a cost one, but it is still
# the reason the ceiling below exists.
#
# It runs only while a walk is active, and stops when the run is paused. Left
# streaming between walks it would spend the uplink for nothing and compete
# with the publisher sending the last run's clips.
#
# Needs an iperf3 server — see server/README.md, which runs one alongside the
# report receiver on the same box.
# ----------------------------------------------------------------------------
udp_load:
  enabled: false
  server: null

  # Bytes per datagram. Do not raise this. iperf3 defaults to 32 KB datagrams,
  # which IP then fragments into two dozen packets — lose any one and the whole
  # datagram counts lost, so loss reads several times worse than a real
  # 1200-byte video packet would see. 1200 is what WebRTC settles on.
  datagram_bytes: 1200

  # Runaway guard, not a cost control — the SIM is unlimited. Set it well above
  # what a real walk spends (bitrate x duration), because hitting it mid-walk
  # stops the measurement and leaves the rest of the garage unmeasured.
  run_data_budget_mb: 2000

  # iperf3's own authentication, shared by both directions. Leave blank only
  # for a server that cannot be reached from the internet — an open one is a
  # bandwidth allowance anyone who finds the port can spend.
  username: ""
  password: ""
  public_key_path: ""

  # --- uplink: the robot's video, going out of the garage -------------------
  # Usually the half that decides whether a spot is workable, because cellular
  # uplink is typically the weaker direction.
  #
  # Only the far end can see what arrived, so this runs in blocks and asks the
  # server what it received; the per-second readings are then written onto the
  # samples they belong to. That is why it needs its own port: one iperf3
  # server runs one test at a time, so the two directions cannot share one.
  uplink_enabled: true
  uplink_port: 5201
  # MEASURED from a live Formant teleop session, 2026-09-12: the robot sent
  # 645 kbit/s mean, 672 median, 764 peak over a 37-second window. 1M sits
  # just above the peak, so a spot that carries this carries a real session
  # with room to spare.
  #
  # Note this is not a Formant *specification*, it is what one session with
  # one robot's camera settings actually used. Re-measure if the video
  # resolution or frame rate changes.
  uplink_bitrate: 1M
  # Seconds per block. Shorter recovers readings sooner after a dead spot;
  # longer spends less time re-establishing the test.
  uplink_block_s: 30

  # --- downlink: the operator's commands, coming in ------------------------
  # Small, but if it collapses the robot stops taking orders. The rig is the
  # receiving end here, so these readings arrive live, once a second.
  downlink_enabled: true
  downlink_port: 5202
  # The operator sent 64 kbit/s mean, 104 peak in the same session — this is
  # control and telemetry, and it is tiny.
  #
  # 300k rather than ~150k on purpose. Loss is counted in whole datagrams, so
  # at 1200 bytes a 150 kbit/s stream is only ~15 packets a second and a single
  # loss reads as 6.7%. 300k roughly doubles the resolution for an amount of
  # traffic that is still negligible next to the uplink.
  downlink_bitrate: 300k

# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# Modem signal metrics: RSRP, RSRQ, SINR, band and cell ID on every sample.
#
# These cost no cellular data and they are what distinguishes one kind of dead
# zone from another. Low RSRP with decent SINR is concrete in the way — expected
# in a garage, and fixable with an antenna. Decent RSRP with poor SINR is
# interference or a congested cell, which an antenna will not fix. A cell ID
# that changes at the same spot every pass is a handover, and handovers are a
# well-known source of a few dead seconds.
#
# client:
#   "null"     collect nothing. The safe default; the rig works without this.
#   "at_ssh"   SSH to the router and talk AT to the modem. What this rig uses:
#              its router has no modem API at all — no ubus over HTTP, no LuCI
#              RPC, no vendor CLI — so the AT port is the only way in.
#   "ubus"     OpenWrt ubus JSON-RPC, for a router that exposes one.
#   "luci"     the older LuCI RPC endpoint, same.
#
# Run scripts/probe_router.py against an unfamiliar router to see which fits.
#
# For "at_ssh", authentication is by SSH key if the Pi has one the router
# accepts, and by password otherwise. The password route needs nothing done to
# the router, which matters when the rig meets a different unit out of the fleet
# each time; the key route leaves no secret on the Pi but has to be installed on
# every router. Either way config/config.yaml is gitignored and every value
# under a key named "password" is masked before it reaches the database, the
# API or the dashboard.
# ----------------------------------------------------------------------------
router:
  client: "null"
  # Seconds between readings. Signal moves slowly compared with walking pace,
  # and the floor is 1 s: a faster poll would collect the same number twice.
  interval_s: 2
  username: root
  password: ""

  # at_ssh only. ttyUSB2 is the AT interpreter on every Quectel modem we have
  # seen; the other three ports on the same modem are not.
  at_device: /dev/ttyUSB2
  at_command: 'AT+QENG="servingcell"'

  # ubus only. Set by probe_router.py once discovered.
  ubus_object: null
  ubus_method: null

# ----------------------------------------------------------------------------
# Publishing: where a finished run goes so somebody can read it.
#
# When a walk ends the rig writes a report page, then queues it, the dead-zone
# clips, and (on request only) the full recording. The queue lives in the
# database, so pulling the plug mid-upload costs one chunk rather than the run:
# the next power-on asks the receiver how much it already has and carries on
# from there.
#
# Nothing uploads while a run is in progress. The upload would travel over the
# cellular link the survey is measuring, and would manufacture the latency and
# loss the walk exists to record.
#
# The receiver is in server/ — see server/README.md to stand one up. Leave
# `enabled: false` and the rig keeps every report locally at
# http://192.168.50.1/api/runs/<run-id>/report.html instead.
# ----------------------------------------------------------------------------
publish:
  enabled: false
  # Base URL of the receiving server, e.g. https://surveys.example.com
  url: ""
  # Shared secret; must match VIABOT_RECEIVER_TOKEN on the server.
  token: ""

  # Bytes per request. Every chunk boundary is a place a power cut is free, so
  # smaller is safer and slower. 512 KiB costs about a second of progress.
  chunk_bytes: 524288
  # Seconds between passes over the queue while idle.
  interval_s: 60
  timeout_s: 60

  # Offer the full walk recording behind a button on the report rather than
  # sending it. Clips are a few tens of megabytes; the whole walk is a few
  # hundred, on a SIM whose plan nobody has checked.
  offer_full_video: true

# ----------------------------------------------------------------------------
# Camera. Records continuously to local disk for later review — video is
# deliberately NOT served over the Wi-Fi AP.
#
# The rig's camera (LRCP USB2.0, Realtek 0bda:3035) has been characterised. In
# MJPEG it offers 1920x1080, 1280x1024, 1280x720, 1024x768, 800x600, 640x480,
# 352x288, 320x240 and 160x120 — every one of them at 30 fps and *only* at
# 30 fps. Run `./scripts/probe_camera.sh` if you swap the camera.
# ----------------------------------------------------------------------------
camera:
  enabled: true
  device: /dev/video0
  width: 1280
  height: 720

  # Frames per second actually written to disk. Lower means smaller files and
  # less CPU; 10 is ample for walking pace.
  fps: 10

  # Frames per second requested *from the camera*. Leave null to let the driver
  # use its own rate, which is what you want: this camera advertises 30 fps and
  # nothing else, and asking a UVC device for a rate it does not offer makes it
  # quietly keep sending 30 while ffmpeg believes it is getting what it asked
  # for — which skews the timestamps the whole rig depends on. With null, the
  # capture runs native and is decimated to `fps` on the way to disk.
  capture_fps: null
  # "overlay" burns a human-readable wall clock into the picture (uses ~1 CPU
  #           core on a Pi 4 at 720p10 — this is the mode that makes
  #           timestamp correlation foolproof).
  # "copy"    stores the camera's native MJPEG untouched at near-zero CPU;
  #           timestamps then come from the segment filename plus offset.
  #           Use this if the Pi struggles or you raise the resolution.
  mode: overlay
  # Length of each video file, seconds. Shorter = less lost to a bad shutdown.
  segment_s: 300
  # Refuse to start (and stop an in-flight run) below this much free disk.
  min_free_disk_mb: 2000

# ----------------------------------------------------------------------------
# What counts as a dead zone, and what footage to cut around it.
#
# THESE NUMBERS ARE PROVISIONAL — a placeholder for "very bad connection" until
# a real survey walk says what the robot actually cannot tolerate.
#
# A stretch becomes a dead zone when the link is at least this bad for at least
# `min_duration_s`. Loss OR latency is enough; they do not both have to be true.
# ----------------------------------------------------------------------------
deadzone:
  provisional: true
  loss_pct_at_least: 80
  or_rtt_ms_at_least: 1500
  # Shorter blips are noise — walking behind a pillar drops a packet or two.
  min_duration_s: 5
  # Two dead zones closer together than this are reported as one. Without this
  # a single bad ramp becomes six entries with six nearly identical clips.
  merge_gap_s: 10
  # Footage cut around each zone. The clip runs pre_roll + the zone's own
  # length + post_roll, so clips vary in length with the dead zone.
  pre_roll_s: 10
  post_roll_s: 5
  # Cut clips when the run ends. Uses stream copy, so it is quick, at the cost
  # of each clip starting at the nearest keyframe (within a second or two).
  extract_clips: true

# ----------------------------------------------------------------------------
# Thresholds that colour the live status banner.
#
# THESE NUMBERS ARE PROVISIONAL. No latency ceiling, throughput floor or
# loss tolerance has ever been established for the robot this rig exists to
# support — they are a starting point, not a requirement. Do one real survey
# walk, look at what a working stretch and a genuinely bad stretch actually
# measure, and set them from that.
#
# These only drive the colour you see while walking; `deadzone:` above is what
# decides the results. Set `provisional: false` once they mean something.
# ----------------------------------------------------------------------------
thresholds:
  provisional: true
  degraded_loss_pct: 5
  degraded_rtt_ms: 200
  bad_loss_pct: 20
  bad_rtt_ms: 500
  # Consecutive seconds of 100% loss before a stretch is called a dead zone.
  dead_after_s: 5

# ----------------------------------------------------------------------------
# Web server / captive portal.
# ----------------------------------------------------------------------------
web:
  host: 0.0.0.0
  # Port 80 is required for captive-portal detection to work.
  port: 80
  # Hostname served alongside the IP, so you can type http://viabot.rig/
  portal_hostname: viabot.rig
  # Redirect any unknown host/path to the dashboard (the captive-portal trick).
  captive_portal: true

# ----------------------------------------------------------------------------
# Storage.
# ----------------------------------------------------------------------------
storage:
  # Relative paths resolve against the repository root.
  data_dir: data

# ----------------------------------------------------------------------------
# Over-the-air updates (git pull from GitHub over the cellular link).
# ----------------------------------------------------------------------------
update:
  enabled: true
  remote: origin
  branch: main
